<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMGE Result Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#e3e6ee;--pass:#16a34a;--fail:#dc2626;--ac:#4f46e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2e;--tx:#e8eaf2;--mu:#9aa3b8;--bd:#2a3050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2e;--tx:#e8eaf2;--mu:#9aa3b8;--bd:#2a3050;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{font-size:1rem;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:.95rem;cursor:pointer}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
textarea,input[type=text],select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px;font:inherit}
textarea{min-height:80px;margin-top:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:12px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .1s}
#msg{color:var(--mu);font-size:.9rem;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.5rem}.stat span{color:var(--mu);font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cv{position:relative;height:300px}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
.p{color:var(--pass);font-weight:600}.f{color:var(--fail);font-weight:600}
#res{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>FMGE Result Analyzer</h1>
<p class="sub">Upload the result PDF (or CSV/TXT), or paste rows. Everything runs in your browser.</p>

<div class="card">
<h2>1. Load data</h2>
<div class="row">
<input type="file" id="file" accept=".pdf,.csv,.txt">
<button class="alt" id="sample">Load sample</button>
</div>
<textarea id="paste" placeholder="Or paste text like: 1 FMGE26201349 2611200001 105 FAIL"></textarea>
<div class="row" style="margin-top:10px"><button id="go">Analyze pasted text</button></div>
<div class="bar" id="bar"><i id="bi"></i></div>
<div id="msg"></div>
</div>

<div id="res">
<div class="stats" id="stats"></div>
<div class="grid">
<div class="card"><h2>Pass vs Fail</h2><div class="cv"><canvas id="c1"></canvas></div></div>
<div class="card"><h2>Score bands (students)</h2><div class="cv"><canvas id="c2"></canvas></div></div>
</div>
<div class="card"><h2>Score distribution (20-mark bins)</h2><div class="cv"><canvas id="c3"></canvas></div></div>
<div class="card"><h2>Search and browse</h2>
<div class="row" style="margin-bottom:10px">
<input type="text" id="q" placeholder="Search roll no. or application no." style="flex:2;min-width:200px">
<select id="fl" style="flex:1;min-width:120px"><option value="">All</option><option>PASS</option><option>FAIL</option></select>
<select id="so" style="flex:1;min-width:140px"><option value="hi">Highest score</option><option value="lo">Lowest score</option><option value="rn">Roll number</option></select>
<button class="alt" id="dl">Download CSV</button>
</div>
<div class="tw"><table><thead><tr><th>#</th><th>Application</th><th>Roll No.</th><th>Score</th><th>Result</th></tr></thead><tbody id="tb"></tbody></table></div>
<div id="cnt" style="color:var(--mu);font-size:.85rem;margin-top:8px"></div>
</div>
</div>
</div>

<script>
var rows=[],charts={};
var $=function(i){return document.getElementById(i)};
var SAMPLE="1 FMGE26201349 2611200001 105 FAIL 2 FMGE26232086 2611200002 162 PASS 3 FMGE26212439 2611200003 133 FAIL 4 FMGE26217962 2611200004 99 FAIL 5 FMGE26237240 2611200005 100 FAIL 6 FMGE26239934 2611200006 114 FAIL";

function parse(t){
  var re=/(FMGE\d+)[\s,;|]+(\d{6,})[\s,;|]+(-?\d+(?:\.\d+)?)[\s,;|]+(PASS|FAIL)/gi,m,seen={},out=[];
  while((m=re.exec(t))){
    if(seen[m[2]])continue;seen[m[2]]=1;
    out.push({app:m[1].toUpperCase(),roll:m[2],score:parseFloat(m[3]),res:m[4].toUpperCase()});
  }
  return out;
}
function msg(s){$('msg').textContent=s}

async function readPdf(f){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var buf=await f.arrayBuffer();
  var pdf=await pdfjsLib.getDocument({data:buf}).promise,all=[];
  $('bar').style.display='block';
  for(var i=1;i<=pdf.numPages;i++){
    var pg=await pdf.getPage(i),tc=await pg.getTextContent();
    all.push(tc.items.map(function(x){return x.str}).join(' '));
    if(i%10===0||i===pdf.numPages){$('bi').style.width=(i/pdf.numPages*100)+'%';msg('Reading page '+i+' of '+pdf.numPages+'...')}
  }
  return all.join('\n');
}
async function load(f){
  try{
    var t;
    if(/\.pdf$/i.test(f.name)){msg('Opening PDF...');t=await readPdf(f)}
    else t=await f.text();
    run(t);
  }catch(e){msg('Could not read the file ('+e.message+'). Try exporting the PDF text to .txt and uploading that, or paste rows below.')}
}
function run(t){
  rows=parse(t);
  if(!rows.length){msg('No rows found. Expected format: Application No, Roll No, Score, PASS/FAIL.');return}
  msg('Parsed '+rows.length.toLocaleString()+' students.');
  render();
}
function pct(n,d){return d?(n/d*100).toFixed(1)+'%':'0%'}
function render(){
  $('res').style.display='block';
  var sc=rows.map(function(r){return r.score}).sort(function(a,b){return a-b}),n=sc.length;
  var sum=sc.reduce(function(a,b){return a+b},0),mean=sum/n;
  var med=n%2?sc[(n-1)/2]:(sc[n/2-1]+sc[n/2])/2;
  var sd=Math.sqrt(sc.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/n);
  var P=rows.filter(function(r){return r.res==='PASS'}),F=rows.filter(function(r){return r.res==='FAIL'});
  var avg=function(a){return a.length?(a.reduce(function(s,r){return s+r.score},0)/a.length).toFixed(1):'-'};
  var cards=[['Total students',n.toLocaleString()],['Passed',P.length.toLocaleString()],['Failed',F.length.toLocaleString()],
   ['Pass %',pct(P.length,n)],['Average score',mean.toFixed(1)],['Median',med],['Std deviation',sd.toFixed(1)],
   ['Highest',sc[n-1]],['Lowest',sc[0]],['Avg (passed)',avg(P)],['Avg (failed)',avg(F)],
   ['Min score to pass',P.length?Math.min.apply(null,P.map(function(r){return r.score})):'-']];
  $('stats').innerHTML=cards.map(function(c){return '<div class="stat"><b>'+c[1]+'</b><span>'+c[0]+'</span></div>'}).join('');
  var tx=getComputedStyle(document.documentElement).getPropertyValue('--tx')||'#888';
  Chart.defaults.color=tx.trim()||'#888';
  var mk=function(id,cfg){if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),cfg)};
  var opt={responsive:true,maintainAspectRatio:false};
  mk('c1',{type:'pie',data:{labels:['Pass','Fail'],datasets:[{data:[P.length,F.length],backgroundColor:['#16a34a','#dc2626']}]},
    options:Object.assign({},opt,{plugins:{tooltip:{callbacks:{label:function(c){return c.label+': '+c.raw+' ('+pct(c.raw,n)+')'}}}}})});
  var bands=[[-1e9,49,'Below 50'],[50,99,'50-99'],[100,149,'100-149'],[150,199,'150-199'],[200,249,'200-249'],[250,1e9,'250+']];
  var bc=bands.map(function(b){return sc.filter(function(s){return s>=b[0]&&s<=b[1]+0.999}).length});
  mk('c2',{type:'doughnut',data:{labels:bands.map(function(b){return b[2]}),datasets:[{data:bc,backgroundColor:['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6']}]},
    options:Object.assign({},opt,{plugins:{tooltip:{callbacks:{label:function(c){return c.label+': '+c.raw+' ('+pct(c.raw,n)+')'}}}}})});
  var lo=Math.floor(sc[0]/20)*20,hi=Math.floor(sc[n-1]/20)*20,labels=[],cnt=[];
  for(var b=lo;b<=hi;b+=20){labels.push(b+'-'+(b+19));cnt.push(sc.filter(function(s){return s>=b&&s<b+20}).length)}
  mk('c3',{type:'bar',data:{labels:labels,datasets:[{label:'Students',data:cnt,backgroundColor:'#4f46e5'}]},options:Object.assign({},opt,{plugins:{legend:{display:false}}})});
  table();
}
function view(){
  var q=$('q').value.trim().toLowerCase(),f=$('fl').value,s=$('so').value;
  var a=rows.filter(function(r){return(!f||r.res===f)&&(!q||r.roll.indexOf(q)>-1||r.app.toLowerCase().indexOf(q)>-1)});
  a.sort(function(x,y){return s==='hi'?y.score-x.score:s==='lo'?x.score-y.score:x.roll.localeCompare(y.roll)});
  return a;
}
function table(){
  var a=view();
  $('tb').innerHTML=a.slice(0,100).map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+r.app+'</td><td>'+r.roll+'</td><td>'+r.score+'</td><td class="'+(r.res==='PASS'?'p':'f')+'">'+r.res+'</td></tr>'}).join('');
  $('cnt').textContent='Showing '+Math.min(100,a.length)+' of '+a.length.toLocaleString()+' matching rows';
}
$('file').onchange=function(e){if(e.target.files[0])load(e.target.files[0])};
$('go').onclick=function(){run($('paste').value)};
$('sample').onclick=function(){$('paste').value=SAMPLE;run(SAMPLE)};
['q','fl','so'].forEach(function(i){$(i).oninput=function(){if(rows.length)table()}});
$('dl').onclick=function(){
  var c='Application,Roll,Score,Result\n'+view().map(function(r){return [r.app,r.roll,r.score,r.res].join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='fmge-results.csv';a.click();
};
</script>
</body>
</html>
